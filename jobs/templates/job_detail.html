{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Detail</title>
</head>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<body>
    <div class="job-detail">
    <p>{{ job.title }}</p>
    <p>{{ job.company }}</p>
    <p>{{ job.location }}</p>
    <p>{{ job.description }}</p>
    <p>{{ job.salary }}</p>
    <p>{{ job.created_at }}</p>
    <a href="{% url 'job_delete' job.id%}">Delete</a>
</div>


</body>
</html>
